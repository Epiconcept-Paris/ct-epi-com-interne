<!--
  Template Epiconcept — Communication interne
  Cible : Gmail (Google Workspace) — web, iOS, Android. Previewable dans navigateur.
  Placeholders à substituer :
    {{TITLE}}            — sujet court (titre du mail)
    {{HEADER_BANNER}}    — bloc HTML du bandeau haut (img ou fallback CSS)
    {{LANG_NOTICE}}      — "🇬🇧 english version below" si bilingue, sinon ""
    {{CONTENT_FR}}       — contenu FR rendu en HTML
    {{LANG_DIVIDER}}     — divider entre FR et EN si bilingue (bloc <tr> complet), sinon ""
    {{CONTENT_EN}}       — contenu EN rendu en HTML (paragraphes, listes — pas de <tr>), ou "" si mono-langue
    {{SIGNATURE}}        — bloc signature (équipe + email contact)
    {{YEAR}}             — année (ex. 2026)
  Le footer légal suit directement la signature, dans la même carte blanche,
  séparé par un trait gris fin : il fait partie de l'email, pas d'un habillage.
-->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{{TITLE}}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f4; font-family:'Source Sans Pro','Segoe UI',Arial,sans-serif; color:#434343;">

  <!-- Wrapper full-width -->
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#f4f4f4" style="background-color:#f4f4f4;">
    <tr>
      <td align="center" style="padding:20px 10px;">

        <!-- Container 600px -->
        <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" bgcolor="#ffffff" style="max-width:600px; width:100%; background-color:#ffffff;">

          <!-- ============ BANDEAU HAUT ============ -->
          <tr>
            <td align="center" style="padding:0;">
              {{HEADER_BANNER}}
            </td>
          </tr>

          <!-- ============ TITRE + MENTION BILINGUE ============ -->
          <tr>
            <td align="left" bgcolor="#ffffff" style="padding:30px 30px 10px 30px; background-color:#ffffff;">
              <h1 style="margin:0 0 8px 0; font-family:'Source Sans Pro','Segoe UI',Arial,sans-serif; font-size:26px; font-weight:700; color:#246589; line-height:1.2;">
                {{TITLE}}
              </h1>
              <div style="font-size:13px; color:#999999;">{{LANG_NOTICE}}</div>
            </td>
          </tr>

          <!-- ============ CONTENU FR ============ -->
          <tr>
            <td align="left" bgcolor="#ffffff" style="padding:10px 30px 20px 30px; background-color:#ffffff; font-family:'Source Sans Pro','Segoe UI',Arial,sans-serif; font-size:16px; line-height:1.55; color:#434343;">
              {{CONTENT_FR}}
            </td>
          </tr>

          <!-- ============ DIVIDER FR/EN (bloc <tr> complet, ou vide) ============ -->
          {{LANG_DIVIDER}}

          <!-- ============ CONTENU EN (optionnel — cellule vide si mono-langue) ============ -->
          <tr>
            <td align="left" bgcolor="#ffffff" style="padding:0 30px; background-color:#ffffff; font-family:'Source Sans Pro','Segoe UI',Arial,sans-serif; font-size:16px; line-height:1.55; color:#434343;">
              {{CONTENT_EN}}
            </td>
          </tr>

          <!-- ============ SIGNATURE ============ -->
          <tr>
            <td align="left" bgcolor="#ffffff" style="padding:20px 30px 24px 30px; background-color:#ffffff; font-family:'Source Sans Pro','Segoe UI',Arial,sans-serif; font-size:15px; line-height:1.5; color:#434343;">
              {{SIGNATURE}}
            </td>
          </tr>

          <!-- ============ FOOTER LÉGAL (dans la carte, sous un trait gris fin) ============ -->
          <tr>
            <td bgcolor="#ffffff" style="padding:0 30px 24px 30px; background-color:#ffffff;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#ffffff" style="border-top:1px solid #e5e5e5; padding:16px 0 0 0; background-color:#ffffff; font-family:'Source Sans Pro','Segoe UI',Arial,sans-serif; font-size:11px; color:#999999; line-height:1.6;">
                    <div style="margin-bottom:3px;">Copyright &copy; {{YEAR}} EPICONCEPT</div>
                    <div>Vous recevez cet email en tant que salari&eacute;&middot;e d'Epiconcept / You are receiving this email as an Epiconcept staff member.</div>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
        <!-- /Container -->

      </td>
    </tr>
  </table>
  <!-- /Wrapper -->

</body>
</html>
